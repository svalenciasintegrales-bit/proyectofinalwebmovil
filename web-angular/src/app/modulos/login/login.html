<div class="fondo">
  <div class="caja">
    <div class="text-center mb-4">
      <img src="img/logo.png" alt="Caracoli Inmobiliaria" class="logo">
      <p class="text-muted mb-0 mt-2 fw-bold">Panel administrativo</p>
    </div>

    <div *ngIf="error" class="alert alert-danger py-2"><i class="bi bi-exclamation-circle me-2"></i>{{ error }}</div>

    <form>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="usuario" name="usuario" [(ngModel)]="usuario" placeholder="usuario">
        <label for="usuario">Usuario</label>
      </div>
      <div class="form-floating mb-4">
        <input type="password" class="form-control" id="contrasena" name="contrasena" [(ngModel)]="contrasena"
          (keyup.enter)="consulta()" placeholder="contraseña">
        <label for="contrasena">Contraseña</label>
      </div>
      <button type="button" class="btn btn-rojo w-100 btn-lg" (click)="consulta()" [disabled]="enviando">
        {{ enviando ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <div class="text-center mt-4 small text-muted">
      <i class="bi bi-shield-lock me-1"></i>Acceso exclusivo para el equipo de Caracoli Inmobiliaria
    </div>
  </div>
</div>
