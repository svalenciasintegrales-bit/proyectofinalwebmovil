<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="tam" content="1900x1100">
<title>Mapa de navegacion - Panel</title>
<link rel="stylesheet" href="../../comun.css">
<script src="../../uml.js"></script>
<script src="_pant.js"></script>
</head>
<body>
<div id="lienzo" class="lienzo" style="width:1900px;height:1100px">
  <div class="diag-cab">
    <div class="barra"></div>
    <img src="../../../../../web-angular/public/img/logo.png" alt="">
    <div>
      <div class="t">Mapa de navegación · Panel web de la inmobiliaria</div>
      <div class="s">Rutas /login y /panel/* protegidas por validaruserGuard · menú lateral con Tablero, Inmuebles, Solicitudes, Clientes y, solo para el administrador, Reportes y Usuarios</div>
    </div>
    <div class="der">Sistema InmoConecta<br>Caracoli Inmobiliaria</div>
  </div>
</div>
<script>
var P = '../../../png/mockups/web/';
var W = 300, H = 186;
pant('w01', { x: 40,   y: 430, w: W, h: H, img: P + '01-login.png', titulo: 'Login', sub: '/login' });
pant('w02', { x: 440,  y: 430, w: W, h: H, img: P + '02-tablero.png', titulo: 'Tablero', sub: '/panel/tablero' });
pant('w03', { x: 900,  y: 110, w: W, h: H, img: P + '03-inmuebles.png', titulo: 'Inmuebles', sub: '/panel/inmuebles' });
pant('w05', { x: 900,  y: 350, w: W, h: H, img: P + '05-solicitudes.png', titulo: 'Solicitudes', sub: '/panel/solicitudes' });
pant('w07', { x: 900,  y: 590, w: W, h: H, img: P + '07-clientes.png', titulo: 'Clientes', sub: '/panel/clientes' });
pant('w08', { x: 900,  y: 830, w: W, h: H, img: P + '08-reportes.png', titulo: 'Reportes', sub: 'solo administrador' });
pant('w09', { x: 1300, y: 830, w: W, h: H, img: P + '09-usuarios.png', titulo: 'Usuarios', sub: 'solo administrador' });
pant('w04', { x: 1300, y: 110, w: W, h: H, img: P + '04-nuevo-inmueble.png', titulo: 'Modal Nuevo / Editar inmueble', sub: 'mismo componente' });
pant('w06', { x: 1300, y: 350, w: W, h: H, img: P + '06-responder-solicitud.png', titulo: 'Modal Responder solicitud', sub: 'mismo componente' });
pant('w10', { x: 40,   y: 830, w: W, h: H, img: P + '10-no-encontrado.png', titulo: 'Página no encontrada', sub: 'ruta **' });

rel('w01', 'w02', { tipo: 'navegable', desde: 'r', hasta: 'l', fd: 0.45, recta: 'h', etiqueta: 'Entrar', dy: -12 });
rel('w02', 'w03', { tipo: 'navegable', desde: 'r', hasta: 'l', fd: 0.2, fh: 0.45, orto: true, etiqueta: 'menú / + Publicar', tl: 0.75, dy: -12 });
rel('w02', 'w05', { tipo: 'navegable', desde: 'r', hasta: 'l', fd: 0.35, fh: 0.5, orto: true, etiqueta: 'menú / campana', tl: 0.6, dy: -12 });
rel('w02', 'w07', { tipo: 'navegable', desde: 'r', hasta: 'l', fd: 0.5, fh: 0.45, orto: true });
rel('w02', 'w08', { tipo: 'navegable', desde: 'r', hasta: 'l', fd: 0.65, fh: 0.45, orto: true, etiqueta: 'menú Administración', tl: 0.86, dy: -12 });
rel('w08', 'w09', { tipo: 'navegable', desde: 'r', hasta: 'l', fd: 0.45, recta: 'h' });
rel('w03', 'w04', { tipo: 'navegable', desde: 'r', hasta: 'l', fd: 0.45, recta: 'h', etiqueta: 'Nuevo / lápiz', dy: -12 });
rel('w05', 'w06', { tipo: 'navegable', desde: 'r', hasta: 'l', fd: 0.45, recta: 'h', etiqueta: 'Responder', dy: -12 });
rel('w02', 'w01', { tipo: 'navegable', desde: 'b', hasta: 'b', fd: 0.25, fh: 0.7, via: [[515, 760], [250, 760]], etiqueta: 'Cerrar sesión', tl: 0.45 });
rel('w10', 'w02', { tipo: 'navegable', desde: 'r', hasta: 'b', fd: 0.45, fh: 0.65, orto: true, etiqueta: 'Ir al inicio', tl: 0.3, dy: -12 });

nota('nGuard', { x: 1300, y: 600, w: 560, html: '<b>validaruserGuard</b>: si no hay <i>id</i> en sessionStorage, cualquier ruta /panel/* redirige a /login. Un asesor que abre Reportes o Usuarios por la URL ve el aviso de solo administrador.' });
rel('nGuard', 'w07', { tipo: 'nota', desde: 'l', hasta: 'r', fd: 0.5, fh: 0.3 });
dibujar();
</script>
</body>
</html>
