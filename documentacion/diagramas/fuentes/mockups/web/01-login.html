<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="tam" content="1440x900">
  <meta name="escala" content="1.5">
  <title>Login | Panel InmoConecta</title>
  <link rel="stylesheet" href="bootstrap-lite.css">
  <link rel="stylesheet" href="panel.css">
  <style>
    /* copia de web-angular/src/app/modulos/login/login.css (min-height:100vh -> 900px del lienzo) */
    .fondo {
      height: 900px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: linear-gradient(120deg, rgba(10,10,10,0.88), rgba(139,0,0,0.75)), url("../../../../../web-angular/public/img/llaves.jpg") center / cover;
    }

    .caja {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 6px;
      border-top: 6px solid var(--cr-rojo);
      padding: 2.2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .logo {
      height: 120px;
      width: auto;
    }

    /* contraseña: puntos como los dibuja el navegador */
    .puntos { letter-spacing: .12em; font-size: 1.05rem; }
    .cursor { display: inline-block; width: 1px; height: 1.1rem; background: #212529; vertical-align: -0.2rem; margin-left: 1px; }
  </style>
</head>
<body>
  <div class="fondo">
    <div class="caja">
      <div class="text-center mb-4">
        <img src="../../../../../web-angular/public/img/logo.png" alt="Caracoli Inmobiliaria" class="logo">
        <p class="text-muted mb-0 mt-2 fw-bold">Panel administrativo</p>
      </div>

      <form>
        <div class="form-floating mb-3">
          <div class="form-control lleno" id="usuario">admin</div>
          <label for="usuario">Usuario</label>
        </div>
        <div class="form-floating mb-4">
          <div class="form-control lleno enfocado" id="contrasena"><span class="puntos">••••••••••••</span><span class="cursor"></span></div>
          <label for="contrasena">Contraseña</label>
        </div>
        <button type="button" class="btn btn-rojo w-100 btn-lg">Entrar</button>
      </form>

      <div class="text-center mt-4 small text-muted">
        <i data-i="escudoCandado" class="me-1"></i>Acceso exclusivo para el equipo de Caracoli Inmobiliaria
      </div>
    </div>
  </div>
  <script src="../../iconos.js"></script>
  <script src="layout.js"></script>
</body>
</html>
